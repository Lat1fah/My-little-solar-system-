<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: black; 
                overflow: hidden;
            }
            .container {
                font-size: 1.8vmin;  /* scales with the window */
                width: 40em;
                height: 40em;
                position: relative;
            }
            .sun {
                position: absolute;
                top: 15em;
                left: 15em;
                width: 10;
                height: 10em;
                background: radial-gradient(circle, fff7a8, gold 60%, orange);
                border-radius: 50%;
                box-shadow: 0 0 4em orange;
            }
            .earth,.moon {
                position: absolute;
                box-sizing: border-box;
                border: 0.1em solid rgba(255, 255, 255, 0.15); /*faint full orbit*/
                border-top-color: white;                       /* and a bright arc that sweeps/drags*/
                border-radius: 50%;  
            } 
            .earth {
                top: -10em; /*centers the 30em ring on the 10em sun*/
                left: -10em;
                width: 30em;
                height: 30em;
                animation: orbit 36.5s
                    linear infinite;
            }
            .moon { 
                top: -4em; /* this should center the moon ring on where the earth dot is*/
                left: calc(50% -4em);
                width: 8em;
                height: 8em;
                animation: orbit 2.7s
                    linear infinite;
            }
            .earth::before,
            .moon::before, {
                content: '';
                position: absolute;
                border-radius: 50%;
            }
            .earth::before, {
                top: 2.8em;
                right: 2.8em;
                width: 3em;
                height: 3em;
                background-color: aqua;
            }
            .moon::before, {
                top: -0.6em; ;
                left: calc(50% -0.6em);
                width: 1.2em; 
                height: 1.2em; 
                background-color: silver;
            }
            @keyframes orbit {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="sun">
                <div class="earth">
                    <div class="moon">

                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
